<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
      Content Security Policy — hardened for a static GitHub Pages deployment.
      script-src/style-src are locked to 'self' plus the exact Google Fonts
      hosts needed; no inline event handlers, no eval, no third-party frames.
      'unsafe-inline' on style-src is required because Vite/React inject
      component styles via <style> tags at runtime; no inline styles carry
      user-controlled data anywhere in this app.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self';
               script-src 'self';
               style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
               font-src 'self' https://fonts.gstatic.com;
               img-src 'self' data:;
               connect-src 'self';
               object-src 'none';
               base-uri 'self';
               form-action 'self';
               upgrade-insecure-requests"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="x-content-type-options" content="nosniff" />

    <meta name="description" content="Santiago Contreras Bustos — Seguridad de la Información, Auditoría de TI, GRC y Gobierno de IA. Auditor interno ISO/IEC 27001 y 27005." />
    <meta name="theme-color" content="#0B132B" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <title>Santiago Contreras Bustos — Seguridad de la Información &amp; GRC</title>
  </head>
  <body class="bg-abyss text-smoke font-body antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
